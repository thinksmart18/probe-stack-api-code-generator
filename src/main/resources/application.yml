server:
  port: 8080

spring:
  application:
    name: probe-stack-api-code-generator
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

codegen:
  # Base directory for generated projects
  output-base-dir: ${CODEGEN_OUTPUT_DIR:./generated-projects}
  
  # Template configuration directory structure
  # codegen_config/
  #   ├── java_code/
  #   │   ├── src/main/java/advice/         (Java templates)
  #   │   ├── src/main/resources/           (Properties templates)
  #   │   └── pom-template.xml              (POM template)
  #   └── README.md
  template-config-dir: ${CODEGEN_TEMPLATE_DIR:./codegen_config}

  # Temporary directory for downloads
  temp-dir: ${CODEGEN_TEMP_DIR:./temp}

  # Cleanup generated files after specified hours (0 = no cleanup)
  cleanup-hours: ${CODEGEN_CLEANUP_HOURS:24}

  # Template paths (relative to template-config-dir)
  templates:
    java-source-dir: java_code/src/main/java
    resources-dir: java_code/src/main/resources
    pom-template: maven_config

  # OpenAPI Generator configuration
  generator:
    language: spring
    library: spring-boot
    api-package-suffix: api
    model-package-suffix: model

  # Fallback configurations (used if template files don't exist)
  pom:
    properties:
      maven.compiler.source: 17
      maven.compiler.target: 17
      springdoc-openapi.version: 2.3.0

    dependencies:
      - groupId: org.springdoc
        artifactId: springdoc-openapi-starter-webmvc-ui
        version: ${springdoc-openapi.version}
      - groupId: org.springframework.boot
        artifactId: spring-boot-starter-validation

  application-properties:
    server.port: 8080
    spring.application.name: generated-service
    springdoc.api-docs.path: /api-docs
    springdoc.swagger-ui.path: /swagger-ui.html

logging:
  level:
    com.probe.stack.code.generator: DEBUG
    org.openapitools: INFO
    org.eclipse.jgit: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: ./logs/codegen.log

##############################################################
probestack:
  github:
    version: 1.0.0
    push:
      enabled: true
    config:
      isPrivate: true
      commit:
        message: "Initial Commit: Generated {app_name}"
    personal:
      accesstoken: "${personal_access_token}"

